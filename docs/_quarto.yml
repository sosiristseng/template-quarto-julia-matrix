# https://quarto.org/docs/projects/quarto-projects.html
project:
  type: website
  output-dir: _site

# https://quarto.org/docs/websites/
website:
  title: "Quarto Julia"
  page-navigation: true
  bread-crumbs: true
  back-to-top-navigation: true
  reader-mode: true
  repo-url: https://github.com/sosiristseng/template-quarto-julia-matrix
  site-url: https://sosiristseng.github.io/template-quarto-julia-matrix
  search:
    show-item-context: true
    type: overlay
  navbar:
    search: true
    left:
      - href: index.ipynb
        text: Home
      - about.qmd
    right:
      - icon: github
        href: https://github.com/sosiristseng/template-quarto-julia-matrix
  sidebar:
    title: false
    style: docked
    collapse-level: 2
    alignment: left
    contents:
      - index.ipynb
      - pythonplot.ipynb
      - pythonplot-lit.ipynb
      - section: "Subdir"
        contents:
          - sub/plots.ipynb
          - sub/plots-lit.ipynb
      - about.qmd

# bibliography: references.bib

# https://quarto.org/docs/output-formats/html-basics.html
# https://quarto.org/docs/output-formats/html-themes.html
format:
  html:
    respect-user-color-scheme: true
    toc: true
    theme: cosmo
    fontsize: 1.1em
    linestretch: 1.7
    code-copy: true
    code-overflow: wrap
    grid:
      sidebar-width: 320px
      body-width: 900px
      margin-width: 320px
    css: styles.css

callout-appearance: simple
date: today
date-format: iso
